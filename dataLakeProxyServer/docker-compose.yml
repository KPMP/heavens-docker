version: "3.5"
services:

  apache:
    container_name: apache-proxy
    image: ${ENV_APACHE_IMAGE}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - "TZ:America/Detroit"
    volumes:
      - ${ENV_UPLOADER_BASE_DIR}/build:/var/www/html/upload
      - ${ENV_CURATION_BASE_DIR}/build:/var/www/html/datamanager
      - ${ENV_SSL_CERT_DIR}:/certs
      - ${ENV_SHIB_CONF_DIR}/shibboleth2.xml:/etc/shibboleth/shibboleth2.xml
      - ${ENV_DATALAKE_FILE_DIR}:/data
      - certbot-certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      local:
        aliases:
          - apache

  certbot:
    image: certbot/certbot
    container_name: certbot-service
    volumes:
      - certbot-certs:/etc/letsencrypt                      	# shared with apache
      - certbot-www:/var/www/certbot                        # shared with apache
      - ./cli.ini:/etc/letsencrypt/cli.ini:ro
    entrypoint: /bin/sh
    command: ["-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $!; done"]
    networks:
      local:

volumes:
  esdata:
  certbot-certs:
  certbot-www:

networks:
  local:
    name: dataLake
    driver: bridge
    ipam:
      driver: default
      config:
        - 
          subnet: 10.10.0.0/16
