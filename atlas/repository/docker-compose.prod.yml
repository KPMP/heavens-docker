version: "3.5"
services:

# NOTE: Depends on Knowledge Environment services.

  apache:
    container_name: repository-apache
    image: ${ENV_APACHE_CONTAINER} 
    ports:
      - "80:80"
      - "443:443"
    environment:
      - ENV_APACHE_SERVER_NAME=${ENV_APACHE_SERVER_NAME}
      - ENV_ARRANGER_SERVER_ADDRESS=${ENV_ARRANGER_SERVER_ADDRESS}
      - ENV_FILE_SERVER_ADDRESS=${ENV_FILE_SERVER_ADDRESS}
      - ENV_EXPLORER_DATA_SERVER_ADDRESS=${ENV_EXPLORER_DATA_SERVER_ADDRESS}
      - "TZ=America/Detroit"
    volumes:
      - ${ENV_REACT_APPDIR}/build:/var/www/html
      - ${ENV_REPOSITORY_APPDIR}/build:/var/www/html/repository
      - ${ENV_EXPLORER_REACT_APPDIR}/build:/var/www/html/explorer
      - ${ENV_SPATIAL_APPDIR}/build:/var/www/html/spatial-viewer
      - ${ENV_COMPARATOR_APPDIR}/build:/var/www/html/comparator
      - ${ENV_SSL_CERT_DIR}:/certs
      - ./evasive.conf:/etc/apache2/mods-enabled/evasive.conf
      - certbot-challenges:/var/www/certbot
    networks:
      local:
        aliases:
          - apache
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
  certbot:
    container_name: certbot-renewer
    image: certbot/certbot:nightly
    restart: unless-stopped
    entrypoint: /bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --post-hook "docker exec uploader-apache /usr/sbin/httpd -k graceful || docker restart uploader-apache" --quiet; sleep 12h & wait $!; done'
    volumes:
      - ${ENV_SSL_CERT_DIR}:/etc/letsencrypt
      - certbot-challenges:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - "TZ=America/Detroit"
    networks:
      local:
        aliases:
          - certbot
volumes:
  certbot-challenges:

networks:
  local:
    name: dataPortal
    ipam:
      driver: default
      config:
        - 
          subnet: 10.12.0.0/16
